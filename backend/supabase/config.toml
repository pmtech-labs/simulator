project_id = "pmp-simulator"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[functions.start_exam]
verify_jwt = true

[functions.submit_answer]
verify_jwt = true

[functions.finish_exam]
verify_jwt = true

[functions.stripe_webhook]
verify_jwt = false

[functions.expire_licenses]
verify_jwt = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
